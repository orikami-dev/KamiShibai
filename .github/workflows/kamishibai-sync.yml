name: Kamishibai - sync with SmartTube

# Every Monday: merge the latest SmartTube into Kamishibai, build, and open a PR if it compiles.
# If the merge conflicts or the build fails, an issue is opened instead, so nothing is silently broken.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "kamishibai-sync"
          git config user.email "kamishibai-sync@users.noreply.github.com"
          git remote add upstream https://github.com/yuliskov/SmartTube.git
          git fetch upstream master
          BEHIND="$(git rev-list --count HEAD..upstream/master)"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" = "0" ]; then exit 0; fi
          git checkout -b "sync/upstream-$(date +%Y%m%d)"
          if git merge --no-edit upstream/master; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
          fi

      - name: Update submodules
        if: steps.merge.outputs.behind != '0' && steps.merge.outputs.conflict == 'false'
        run: git submodule update --init --recursive

      - name: Build
        id: build
        if: steps.merge.outputs.behind != '0' && steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :smarttubetv:assembleStmobileDebug

      - name: Open PR
        if: steps.merge.outputs.behind != '0' && steps.merge.outputs.conflict == 'false' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git push origin "$BRANCH"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "Sync with SmartTube ($(date +%Y-%m-%d))" \
            --body "Merges the latest SmartTube (${{ steps.merge.outputs.behind }} commits). The Kamishibai build passes."

      - name: Report a problem
        if: steps.merge.outputs.behind != '0' && (steps.merge.outputs.conflict == 'true' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.merge.outputs.conflict }}" = "true" ]; then
            WHY="Merge conflict in: $(cat conflicts.txt | tr '\n' ' ')"
          else
            WHY="The build fails after the merge (see the Actions log)."
          fi
          gh issue create --title "SmartTube sync needs a hand" \
            --body "$WHY. See kamishibai/UPSTREAM-TOUCHPOINTS.md. Run kamishibai/sync-upstream.sh locally to fix."
