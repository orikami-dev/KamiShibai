// Kamishibai: the phone, tablet and foldable edition of SmartTube.
// Everything specific to it lives in this file and in src/stmobile, so upstream changes merge without conflicts.

android {
    productFlavors {
        stmobile {
            applicationId "com.orikami.kamishibai"
            // Our own build number, not the SmartTube one (32.68 at the time of v13).
            // versionCode = 100000 + version * 100 + fix: always above the SmartTube codes, so updates install over
            versionName "13.0"
            versionCode 101300
            minSdkVersion 23 // the interface colors are theme attributes (palettes), also used in color state lists
            targetSdkVersion project.properties.compileSdkVersion
            // Library modules only know the TV flavors. F-Droid is the one without the SmartTube self-updater.
            matchingFallbacks = ['stfdroid']
        }
    }

    applicationVariants.all { variant ->
        if (variant.productFlavors[-1].name != 'stmobile') {
            return
        }

        variant.outputs.all { output ->
            def arch = output.getFilter("ABI") ?: "universal"
            output.outputFileName = new File(sprintf("Kamishibai_%s_%s.apk", [variant.versionName, arch]))
        }
    }
}

dependencies {
    stmobileImplementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
